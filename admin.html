<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Panel de Control - CɅRLOS® Awards</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Cinzel:wght@700&family=Inter:wght@400;600&display=swap');

        :root {
            --bg-dark: #0a080f;
            --card-bg: #13101d;
            --gold-light: #fcf6ba;
            --gold-mid: #d4af37;
            --gold-dark: #aa771c;
            --error-red: #ff3c3c;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            background: #0a080f;
            color: #f4f1f8;
            font-family: 'Inter', sans-serif;
            padding: 30px 15px;
            display: flex;
            justify-content: center;
        }

        .admin-card {
            background-color: var(--card-bg);
            border: 1px solid var(--gold-mid);
            border-radius: 12px;
            width: 100%;
            max-width: 500px;
            padding: 30px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.8);
        }

        h1 {
            font-family: 'Cinzel', serif;
            color: var(--gold-light);
            font-size: 1.4rem;
            margin-bottom: 25px;
            text-align: center;
        }

        .section-title {
            font-family: 'Cinzel', serif;
            color: var(--gold-mid);
            font-size: 1rem;
            margin-bottom: 15px;
            border-bottom: 1px solid var(--gold-dark);
            padding-bottom: 5px;
        }

        .golden-input {
            width: 100%;
            height: 44px;
            background: rgba(0, 0, 0, 0.5);
            border: 1px solid var(--gold-dark);
            border-radius: 6px;
            color: #fff;
            font-size: 0.95rem;
            padding: 0 12px;
            margin-bottom: 15px;
        }

        .item-row {
            display: flex;
            gap: 10px;
            margin-bottom: 10px;
        }

        .btn {
            height: 44px;
            background: linear-gradient(135deg, var(--gold-light), var(--gold-mid));
            border: none;
            color: #000;
            font-family: 'Cinzel', serif;
            font-weight: 700;
            border-radius: 6px;
            cursor: pointer;
            width: 100%;
            text-transform: uppercase;
        }

        .btn-danger {
            background: var(--error-red);
            color: #fff;
            width: 44px;
            flex-shrink: 0;
            font-weight: bold;
            border: none;
            border-radius: 6px;
            cursor: pointer;
        }
    </style>
</head>
<body>

    <div class="admin-card">
        <h1>Panel de Administración CɅRLOS®</h1>

        <div class="section-title">Candidatos / Memes</div>
        <div id="participantsList"></div>

        <div class="item-row" style="margin-top: 15px;">
            <input type="text" id="newInput" class="golden-input" style="margin:0;" placeholder="Nombre de nuevo meme/grupo...">
            <button class="btn" style="width: 100px;" onclick="addParticipant()">Añadir</button>
        </div>

        <div class="section-title" style="margin-top: 30px;">Texto Cabecera</div>
        <input type="text" id="subtitleInput" class="golden-input" placeholder="Subtítulo de la gala...">

        <button class="btn" style="margin-top: 15px;" onclick="saveConfig()">Guardar y Publicar en Web</button>
    </div>

    <script>
        // Carga los participantes desde localStorage o usa los valores por defecto
        let participantes = JSON.parse(localStorage.getItem('carlos_custom_participants')) || [
            { id: 101, name: "Participante 1 - El Genio de la Parodia" }, 
            { id: 102, name: "Participante 2 - Obra Maestra del Montaje" }, 
            { id: 103, name: "Participante 3 - Los Infiltrados del Ring" }
        ];

        window.addEventListener('DOMContentLoaded', () => {
            renderList();
            const customSubtitle = localStorage.getItem('carlos_custom_subtitle');
            if(customSubtitle) {
                document.getElementById('subtitleInput').value = customSubtitle;
            } else {
                document.getElementById('subtitleInput').value = "Selección Oficial 2026";
            }
        });

        function renderList() {
            const list = document.getElementById('participantsList');
            list.innerHTML = "";
            participantes.forEach((p, idx) => {
                list.innerHTML += `
                    <div class="item-row">
                        <input type="text" class="golden-input" style="margin:0;" value="${p.name}" onchange="updateName(${idx}, this.value)">
                        <button class="btn-danger" onclick="removeParticipant(${idx})">✕</button>
                    </div>`;
            });
        }

        function updateName(idx, val) {
            participantes[idx].name = val;
        }

        function addParticipant() {
            const input = document.getElementById('newInput');
            if(input.value.trim()) {
                participantes.push({ id: Date.now(), name: input.value.trim() });
                input.value = "";
                renderList();
            }
        }

        function removeParticipant(idx) {
            participantes.splice(idx, 1);
            renderList();
        }

        function saveConfig() {
            localStorage.setItem('carlos_custom_participants', JSON.stringify(participantes));
            const sub = document.getElementById('subtitleInput').value.trim();
            if(sub) {
                localStorage.setItem('carlos_custom_subtitle', sub);
            }
            alert("¡Configuración guardada! Los cambios ya son visibles en su web pública.");
        }
    </script>
</body>
</html>
