<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gala de Los Carlos - Votaciones</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700&family=Inter:wght@300;400;600&display=swap');

        :root {
            --bg-color: #0f0d15;
            --card-bg: #171324;
            --accent-gold: #d4af37;
            --text-main: #e6e1ee;
            --text-muted: #8a819b;
            --border-color: #2e2645;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            font-family: 'Inter', sans-serif;
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
        }

        .container {
            width: 100%;
            max-width: 500px;
        }

        .header {
            text-align: center;
            margin-bottom: 30px;
            border-bottom: 2px solid var(--accent-gold);
            padding-bottom: 20px;
        }

        h1 {
            font-family: 'Cinzel', serif;
            color: var(--accent-gold);
            text-transform: uppercase;
            font-size: 2rem;
            margin: 0;
            letter-spacing: 3px;
        }

        .subtitle {
            color: var(--text-muted);
            font-size: 0.9rem;
            margin-top: 5px;
            letter-spacing: 1px;
            font-style: italic;
        }

        .category-card {
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            padding: 20px;
            margin-bottom: 20px;
            transition: all 0.3s ease;
        }

        .category-card:hover {
            border-color: var(--accent-gold);
            transform: translateY(-2px);
        }

        label {
            font-family: 'Cinzel', serif;
            color: var(--accent-gold);
            display: block;
            margin-bottom: 15px;
            font-size: 1.1rem;
            text-align: center;
        }

        select {
            width: 100%;
            padding: 12px;
            background-color: #201a2f;
            color: var(--text-main);
            border: 1px solid var(--border-color);
            border-radius: 4px;
            font-size: 1rem;
            font-family: 'Inter', sans-serif;
            appearance: none;
            cursor: pointer;
            text-align-last: center;
        }

        select:focus {
            outline: none;
            border-color: var(--accent-gold);
        }

        button {
            width: 100%;
            padding: 16px;
            background: linear-gradient(135deg, var(--accent-gold), #aa820a);
            color: var(--bg-color);
            font-family: 'Cinzel', serif;
            font-size: 1.1rem;
            font-weight: bold;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            text-transform: uppercase;
            letter-spacing: 2px;
            margin-top: 10px;
            transition: opacity 0.3s ease;
        }

        button:hover {
            opacity: 0.9;
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="header">
            <h1>Carlos</h1>
            <p class="subtitle">La Gala de las Grandes Estrellas</p>
        </div>

        <form id="voteForm">
            <div id="categoriesContainer"></div>
            <button type="button" onclick="submitVotes()">Enviar Votos</button>
        </form>
    </div>

    <script>
        const participantes = [
            "Meme 1 - El Genio", 
            "Meme 2 - Obra Maestra", 
            "Pareja C - Los Infiltrados"
        ];

        const categorias = [
            "Carlos a la Mejor Interpretación",
            "Carlos al Mejor Atrezzo",
            "Carlos a la Mejor Puesta en Escena",
            "Carlos a la Mejor Edición",
            "Carlos a la Mejor Innovación",
            "El Carlos de Oro",
            "Carlos al Meme Más Viral o Nostálgico",
            "Carlos a la Parodia Más Fiel",
            "Carlos al Personaje Secundario o Cameo"
        ];

        const container = document.getElementById('categoriesContainer');

        categorias.forEach((cat, idx) => {
            let options = participantes.map(p => `<option value="${p}">${p}</option>`).join('');
            container.innerHTML += `
                <div class="category-card">
                    <label>${cat}</label>
                    <select id="cat_${idx}">
                        <option value="" disabled selected>Elige un nominado</option>
                        ${options}
                    </select>
                </div>`;
        });

        function submitVotes() {
            alert("¡Votos registrados correctamente, Don Pablo!");
        }
    </script>
</body>
</html>
